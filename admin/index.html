<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Pedidos | Don Elio
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div>

            <h1>
                🍕 Don Elio
            </h1>

            <p>
                Monitor de pedidos
            </p>

        </div>

        <div class="estado-conexion">

            <span
                id="indicadorConexion"
                class="indicador offline"
            ></span>

            <span id="textoConexion">
                Conectando...
            </span>

        </div>

    </header>


    <!-- =====================================================
         INFORMACIÓN
    ====================================================== -->

    <section class="barra-info">

        <div class="info">

            <span>
                Pedidos activos:
            </span>

            <strong id="cantidadPedidos">
                0
            </strong>

        </div>

        <div class="info">

            <span>
                Última actualización:
            </span>

            <strong id="ultimaActualizacion">
                --
            </strong>

        </div>

        <button
            id="btnActualizar"
            class="btn-actualizar"
        >
            🔄 Actualizar
        </button>

    </section>


    <!-- =====================================================
         TABLERO
    ====================================================== -->

    <main class="tablero">


        <!-- =================================================
             EN PREPARACIÓN
        ================================================== -->

        <section class="columna">

            <div class="titulo-columna preparacion">

                <div>

                    <span class="emoji">
                        👨‍🍳
                    </span>

                    <span>
                        En preparación
                    </span>

                </div>

                <span
                    id="contador1"
                    class="contador"
                >
                    0
                </span>

            </div>

            <div
                id="columna1"
                class="lista-pedidos"
            ></div>

        </section>


        <!-- =================================================
             LISTO
        ================================================== -->

        <section class="columna">

            <div class="titulo-columna listo">

                <div>

                    <span class="emoji">
                        ✅
                    </span>

                    <span>
                        Listo
                    </span>

                </div>

                <span
                    id="contador2"
                    class="contador"
                >
                    0
                </span>

            </div>

            <div
                id="columna2"
                class="lista-pedidos"
            ></div>

        </section>


        <!-- =================================================
             ENVIAR DELIVERY
        ================================================== -->

        <section class="columna">

            <div class="titulo-columna delivery">

                <div>

                    <span class="emoji">
                        🛵
                    </span>

                    <span>
                        Enviar delivery
                    </span>

                </div>

                <span
                    id="contador3"
                    class="contador"
                >
                    0
                </span>

            </div>

            <div
                id="columna3"
                class="lista-pedidos"
            ></div>

        </section>


        <!-- =================================================
             FINALIZADO
        ================================================== -->
    </main>


    <!-- =====================================================
         MODAL DETALLE
    ====================================================== -->

    <div
        id="modal"
        class="modal oculto"
    >

        <div class="modal-contenido">

            <button
                id="cerrarModal"
                class="cerrar"
            >
                ×
            </button>

            <div id="modalContenido"></div>

        </div>

    </div>


    <script>
        const script = document.createElement("script");
    
        script.src = "app.js?v=" + Date.now();
    
        document.body.appendChild(script);
    </script>

</body>

</html>
