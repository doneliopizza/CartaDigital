<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Don Elio Pizzas & Pastas - Carta Digital"
    >

    <title>
        Don Elio - Carta Digital
    </title>

    <link
        rel="stylesheet"
        href="style.css"
        id="css-principal"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header class="encabezado">

        <div id="logo-contenedor"></div>

    </header>


    <!-- =====================================================
         ESTADO API
    ====================================================== -->

    <div
        id="estado-api"
        class="estado-api cargando"
    >
        ● Conectando...
    </div>


    <!-- =====================================================
         CARTA
    ====================================================== -->

    <main>

        <div
            id="cargando"
            class="cargando"
        >
            Cargando carta...
        </div>


        <div
            id="carta"
            class="carta"
        ></div>

    </main>


    <!-- =====================================================
         BARRA CARRITO
    ====================================================== -->

    <div
        id="carrito-barra"
        class="carrito-barra"
    >

        <div class="carrito-resumen">

            <span class="carrito-icono">
                🛒
            </span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>


        <strong id="total-carrito">
            $0
        </strong>


        <button
            type="button"
            class="btn-ver-pedido"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>


    <!-- =====================================================
         MODAL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal oculto"
    >

        <div class="modal-contenido">


            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ×
            </button>


            <h2>
                Mi pedido
            </h2>


            <div
                id="lista-carrito"
                class="lista-carrito"
            ></div>


            <div class="total-final">

                <span>
                    Total
                </span>

                <strong id="total-modal">
                    $0
                </strong>

            </div>


            <!-- =================================================
                 FORMULARIO CLIENTE
            ================================================== -->

            <div
                id="formulario-pedido"
                class="formulario-pedido"
            >

                <div class="datos-pedido">


                    <h3>
                        👤 Datos del cliente
                    </h3>


                    <label for="cliente-nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="cliente-nombre"
                        placeholder="Tu nombre"
                        autocomplete="name"
                    >


                    <label for="cliente-telefono">
                        Teléfono de contacto
                    </label>

                    <input
                        type="tel"
                        id="cliente-telefono"
                        placeholder="Ej: 11 7066 7389"
                        autocomplete="tel"
                    >


                    <h3>
                        📍 Dirección de entrega
                    </h3>


                    <label for="cliente-calle">
                        Calle
                    </label>

                    <input
                        type="text"
                        id="cliente-calle"
                        placeholder="Ej: Av. San Martín"
                        autocomplete="street-address"
                    >


                    <label for="cliente-altura">
                        Altura
                    </label>

                    <input
                        type="number"
                        id="cliente-altura"
                        placeholder="Ej: 1234"
                        inputmode="numeric"
                    >


                    <label for="cliente-localidad">
                        Localidad
                    </label>

                    <input
                        type="text"
                        id="cliente-localidad"
                        placeholder="Ej: Villa Ballester"
                        autocomplete="address-level2"
                    >


                    <h3>
                        💳 Medio de pago
                    </h3>


                    <div class="medios-pago">


                        <label class="medio-opcion">

                            <input
                                type="radio"
                                name="medio-pago"
                                value="efectivo"
                                onchange="cambiarMedioPago()"
                            >

                            <span>
                                💵 Efectivo
                            </span>

                        </label>


                        <label class="medio-opcion">

                            <input
                                type="radio"
                                name="medio-pago"
                                value="transferencia"
                                onchange="cambiarMedioPago()"
                            >

                            <span>
                                🏦 Transferencia
                            </span>

                        </label>


                        <label class="medio-opcion">

                            <input
                                type="radio"
                                name="medio-pago"
                                value="mercadopago"
                                onchange="cambiarMedioPago()"
                            >

                            <span>
                                💙 Mercado Pago
                            </span>

                        </label>


                    </div>


                    <div
                        id="detalle-pago"
                        class="detalle-pago"
                    ></div>


                </div>

            </div>


            <!-- =================================================
                 ACCIÓN V2
            ================================================== -->

            <div class="accion-pedido">


                <button
                    type="button"
                    class="btn-realizar-pedido"
                    onclick="prepararPedido()"
                >

                    Continuar con el pedido

                </button>


                <div
                    id="mensaje-pedido"
                    class="mensaje-pedido"
                ></div>


            </div>


        </div>

    </div>


    <!-- =====================================================
         NOTIFICACIÓN
    ====================================================== -->

    <div
        id="notificacion"
        class="notificacion oculto"
    ></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /*
         * Cache busting.
         * Cada carga obtiene una versión nueva.
         */

        const versionCache = Date.now();

        const css =
            document.getElementById(
                "css-principal"
            );

        if (css) {

            css.href =
                "style.css?v=" +
                versionCache;

        }

    </script>


    <script
        src="app.js"
        id="js-principal"
        defer
    ></script>


</body>

</html>
