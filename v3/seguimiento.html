<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seguimiento de pedido - Don Elio
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f5f5;

            color:
                #222;

        }

        .contenedor {

            max-width: 600px;

            margin:
                0 auto;

        }

        .tarjeta {

            background:
                white;

            border-radius:
                16px;

            padding:
                25px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.10);

        }

        .logo {

            display:
                block;

            width:
                120px;

            height:
                120px;

            object-fit:
                contain;

            margin:
                0 auto 15px;

        }

        h1 {

            text-align:
                center;

            margin:
                0 0 10px;

        }

        .numero {

            text-align:
                center;

            font-size:
                20px;

            font-weight:
                bold;

            margin-bottom:
                25px;

        }

        .estado {

            text-align:
                center;

            font-size:
                24px;

            font-weight:
                bold;

            margin:
                20px 0;

        }

        .mensaje {

            text-align:
                center;

            color:
                #666;

            margin-bottom:
                25px;

        }

        .linea {

            display:
                flex;

            align-items:
                center;

            margin:
                15px 0;

        }

        .circulo {

            width:
                22px;

            height:
                22px;

            border-radius:
                50%;

            background:
                #ddd;

            flex-shrink:
                0;

        }

        .circulo.activo {

            background:
                #20a464;

        }

        .circulo.cancelado {

            background:
                #d93025;

        }

        .texto-estado {

            margin-left:
                12px;

            font-size:
                16px;

        }

        .detalle {

            margin-top:
                30px;

            border-top:
                1px solid #ddd;

            padding-top:
                20px;

        }

        .producto {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                10px 0;

            border-bottom:
                1px solid #eee;

        }

        .total {

            display:
                flex;

            justify-content:
                space-between;

            font-size:
                20px;

            font-weight:
                bold;

            margin-top:
                20px;

        }

        .error {

            text-align:
                center;

            padding:
                30px 10px;

            color:
                #c62828;

            font-size:
                18px;

        }

        .cargando {

            text-align:
                center;

            padding:
                40px 10px;

            color:
                #666;

        }

    </style>

</head>


<body>


<div class="contenedor">

    <div class="tarjeta">


        <img
            class="logo"
            src="https://raw.githubusercontent.com/doneliopizza/CartaDigital/main/fotos/logo.png"
            alt="Don Elio"
        >


        <h1>
            Seguimiento de pedido
        </h1>


        <div
            id="contenido"
            class="cargando"
        >
            Cargando pedido...
        </div>


    </div>

</div>


<script>

"use strict";


/* ============================================================
   CONFIGURACIÓN
============================================================ */

const API_URL =
    "https://cartadigitalapi.onrender.com";


/* ============================================================
   OBTENER TOKEN
============================================================ */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const token =
    parametros.get("t");


/* ============================================================
   CONTENIDO
============================================================ */

const contenido =
    document.getElementById(
        "contenido"
    );


/* ============================================================
   ESTADOS
============================================================ */

const estados = [

    "PEDIDO REALIZADO",

    "PEDIDO CONFIRMADO",

    "EN CAMINO",

    "ENTREGADO"

];


/* ============================================================
   DESCRIPCIÓN
============================================================ */

function obtenerMensaje(
    estado
) {

    switch (estado) {

        case "PEDIDO REALIZADO":

            return (
                "Recibimos tu pedido. " +
                "Estamos esperando la confirmación."
            );


        case "PEDIDO CONFIRMADO":

            return (
                "¡Tu pedido fue confirmado!"
            );


        case "EN CAMINO":

            return (
                "Tu pedido está en camino."
            );


        case "ENTREGADO":

            return (
                "¡Tu pedido fue entregado!"
            );


        case "CANCELADO":

            return (
                "Este pedido fue cancelado."
            );


        default:

            return (
                "Consultando estado del pedido."
            );

    }

}


/* ============================================================
   CARGAR PEDIDO
============================================================ */

async function cargarPedido() {


    if (!token) {

        contenido.innerHTML = `
            <div class="error">
                Enlace de seguimiento inválido.
            </div>
        `;

        return;

    }


    try {


        const respuesta =
            await fetch(
                API_URL +
                "/pedidos/seguimiento/" +
                encodeURIComponent(
                    token
                ) +
                "?v=" +
                Date.now()
            );


        let datos;


        try {

            datos =
                await respuesta.json();

        } catch {

            datos = {};

        }


        if (!respuesta.ok) {

            throw new Error(
                datos.detail ||
                "No se pudo consultar el pedido."
            );

        }


        mostrarPedido(
            datos.pedido
        );


    } catch (error) {

        console.error(
            error
        );


        contenido.innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;

    }

}


/* ============================================================
   MOSTRAR PEDIDO
============================================================ */

function mostrarPedido(
    pedido
) {


    const estado =
        pedido.estado;


    let estadoHtml = "";


    if (
        estado === "CANCELADO"
    ) {


        estadoHtml = `

            <div class="estado">
                🔴 PEDIDO CANCELADO
            </div>

            <div class="mensaje">
                ${obtenerMensaje(estado)}
            </div>

        `;


    } else {


        const posicion =
            estados.indexOf(
                estado
            );


        let pasos = "";


        estados.forEach(
            (
                nombreEstado,
                indice
            ) => {


                const activo =
                    indice <= posicion
                        ? "activo"
                        : "";


                pasos += `

                    <div class="linea">

                        <div
                            class="circulo ${activo}"
                        ></div>

                        <div class="texto-estado">

                            ${nombreEstado}

                        </div>

                    </div>

                `;

            }
        );


        estadoHtml = `

            <div class="estado">

                ${estado}

            </div>

            <div class="mensaje">

                ${obtenerMensaje(estado)}

            </div>

            ${pasos}

        `;

    }


    let detalleHtml = "";


    pedido.detalle.forEach(
        item => {

            detalleHtml += `

                <div class="producto">

                    <div>

                        ${item.cantidad}
                        x
                        ${item.nombre_producto}

                    </div>

                    <div>

                        $${Number(
                            item.subtotal
                        ).toLocaleString(
                            "es-AR"
                        )}

                    </div>

                </div>

            `;

        }
    );


    contenido.innerHTML = `

        <div class="numero">

            Pedido #${pedido.numero_pedido}

        </div>


        ${estadoHtml}


        <div class="detalle">

            <h3>
                Detalle
            </h3>

            ${detalleHtml}


            <div class="total">

                <span>
                    TOTAL
                </span>

                <span>

                    $${Number(
                        pedido.total
                    ).toLocaleString(
                        "es-AR"
                    )}

                </span>

            </div>

        </div>

    `;

}


/* ============================================================
   INICIO
============================================================ */

cargarPedido();


/* ============================================================
   ACTUALIZAR CADA 10 SEGUNDOS
============================================================ */

setInterval(
    cargarPedido,
    10000
);

</script>


</body>

</html>
