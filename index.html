<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Don Elio - Carta Digital</title>


    <!-- =====================================================
         CSS
         La versión se genera automáticamente.
         Evita que el navegador use una versión vieja.
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
        id="css-principal"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO / LOGO

         EL LOGO SE CARGA AUTOMÁTICAMENTE DESDE app.js
    ====================================================== -->

    <header class="encabezado"></header>



    <!-- =====================================================
         CARTA DIGITAL
    ====================================================== -->

    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>



    <!-- =====================================================
         BARRA FIJA DEL CARRITO
    ====================================================== -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>


        <strong id="total-carrito">
            $0
        </strong>


        <button
            type="button"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>



    <!-- =====================================================
         MODAL DEL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal"
    >

        <div class="modal-contenido">


            <!-- BOTÓN CERRAR -->

            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ✕
            </button>


            <!-- TÍTULO -->

            <h2>
                Mi pedido
            </h2>


            <!-- PRODUCTOS DEL CARRITO -->

            <div id="lista-carrito"></div>


            <!-- TOTAL -->

            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>


            <!-- WHATSAPP -->

            <button
                type="button"
                class="btn-whatsapp"
                onclick="enviarWhatsApp()"
            >

                🟢 Enviar pedido por WhatsApp

            </button>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         La versión se genera automáticamente.
    ====================================================== -->

    <script
        src="app.js"
        id="js-principal"
        defer
    ></script>



    <!-- =====================================================
         CONTROL AUTOMÁTICO DE CACHE
    ====================================================== -->

    <script>

        /*
         * Generamos una versión única cada vez
         * que se carga la página.
         *
         * Date.now() devuelve la fecha/hora actual
         * en milisegundos.
         */

        const VERSION_CACHE = Date.now();


        /*
         * Agregar versión al CSS
         */

        const css =
            document.getElementById(
                "css-principal"
            );

        if (css) {

            css.href =
                "style.css?v=" +
                VERSION_CACHE;

        }


        /*
         * Agregar versión al JavaScript
         */

        const js =
            document.getElementById(
                "js-principal"
            );

        if (js) {

            js.src =
                "app.js?v=" +
                VERSION_CACHE;

        }

    </script>


</body>

</html>
