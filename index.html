<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Don Elio - Carta Digital</title>


    <!-- =====================================================
         CSS
         Cambiar ?v=6 cuando se modifique el CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=5"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO / LOGO

         EL LOGO SE CARGA AUTOMÁTICAMENTE DESDE app.js
    ====================================================== -->

    <header class="encabezado"></header>



    <!-- =====================================================
         CARTA DIGITAL
    ====================================================== -->

    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>



    <!-- =====================================================
         BARRA FIJA DEL CARRITO
    ====================================================== -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>


        <strong id="total-carrito">
            $0
        </strong>


        <button
            type="button"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>



    <!-- =====================================================
         MODAL DEL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal"
    >

        <div class="modal-contenido">


            <!-- BOTÓN CERRAR -->

            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ✕
            </button>


            <!-- TÍTULO -->

            <h2>
                Mi pedido
            </h2>


            <!-- PRODUCTOS DEL CARRITO -->

            <div id="lista-carrito"></div>


            <!-- TOTAL -->

            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>


            <!-- WHATSAPP -->

            <button
                type="button"
                class="btn-whatsapp"
                onclick="enviarWhatsApp()"
            >

                🟢 Enviar pedido por WhatsApp

            </button>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         Cambiar ?v=6 cuando se modifique app.js
    ====================================================== -->

    <script
        src="app.js?v=6"
        defer
    ></script>


</body>

</html>
