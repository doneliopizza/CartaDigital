<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Don Elio - Carta Digital</title>


    <!-- =====================================================
         CSS
         Se carga con una versión nueva en cada visita.
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=1"
        id="css-principal"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header class="encabezado"></header>


    <!-- =====================================================
         CARTA
    ====================================================== -->

    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>


    <!-- =====================================================
         BARRA FIJA DEL CARRITO
    ====================================================== -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>


        <strong id="total-carrito">
            $0
        </strong>


        <button
            type="button"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>


    <!-- =====================================================
         MODAL DEL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal"
    >

        <div class="modal-contenido">


            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ✕
            </button>


            <h2>
                Mi pedido
            </h2>


            <div id="lista-carrito"></div>


            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>


            <button
                type="button"
                class="btn-whatsapp"
                onclick="enviarWhatsApp()"
            >
                🟢 Enviar pedido por WhatsApp
            </button>


        </div>

    </div>


    <!-- =====================================================
         CARGA DINÁMICA DEL JAVASCRIPT
         Cada visita obtiene una versión nueva.
    ====================================================== -->

    <script>

        const VERSION_CACHE = Date.now();


        /* =====================================================
           CSS SIN CACHE
        ===================================================== */

        const css =
            document.getElementById("css-principal");

        if (css) {

            css.href =
                "style.css?v=" +
                VERSION_CACHE;

        }


        /* =====================================================
           JAVASCRIPT SIN CACHE
        ===================================================== */

        const script =
            document.createElement("script");

        script.src =
            "app.js?v=" +
            VERSION_CACHE;

        script.defer = true;

        document.body.appendChild(script);

    </script>


</body>

</html>
