<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Don Elio - Carta Digital</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css?v=1"
        id="css-principal"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header class="encabezado"></header>


    <!-- =====================================================
         CARTA
    ====================================================== -->

    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>


    <!-- =====================================================
         CARRITO FIJO
    ====================================================== -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>

        <strong id="total-carrito">
            $0
        </strong>

        <button
            type="button"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>


    <!-- =====================================================
         MODAL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal"
    >

        <div class="modal-contenido">

            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ✕
            </button>

            <h2>
                Mi pedido
            </h2>

            <div id="lista-carrito"></div>

            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>

            <button
                type="button"
                class="btn-whatsapp"
                onclick="enviarWhatsApp()"
            >
                🟢 Enviar pedido por WhatsApp
            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         El ?v= cambia automáticamente en cada carga.
    ====================================================== -->

    <script>

        const versionCache = Date.now();

        const css = document.getElementById("css-principal");

        if (css) {

            css.href =
                "style.css?v=" +
                versionCache;

        }

    </script>


    <script
        src="app.js?v=1"
        id="js-principal"
        defer
    ></script>


    <script>

        const js = document.getElementById("js-principal");

        if (js) {

            js.src =
                "app.js?v=" +
                Date.now();

        }

    </script>


</body>

</html>
