<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Don Elio - Carta Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="encabezado">

        <h1>DON ELIO</h1>
        <p>Pizzas & Empanadas</p>

    </header>


    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>


    <!-- Carrito -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>

        <strong id="total-carrito">
            $0
        </strong>

        <button onclick="mostrarCarrito()">
            Ver pedido
        </button>

    </div>


    <!-- Modal carrito -->

    <div id="modal-carrito" class="modal">

        <div class="modal-contenido">

            <button
                class="cerrar"
                onclick="cerrarCarrito()">
                ✕
            </button>

            <h2>Mi pedido</h2>

            <div id="lista-carrito"></div>

            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>

            <button
                class="btn-whatsapp"
                onclick="enviarWhatsApp()">

                🟢 Enviar pedido por WhatsApp

            </button>

        </div>

    </div>


    <script src="app.js?v=3"></script>

</body>

</html>
