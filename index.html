<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Don Elio - Carta Digital</title>


    <!-- =====================================================
         CONTROL DE CACHE
    ====================================================== -->

    <script>

        /*
         * Generamos una versión única por carga.
         *
         * Esto evita que el navegador reutilice
         * style.css y app.js de una carga anterior.
         */

        const VERSION_CACHE = Date.now();

    </script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
        id="css-principal"
    >


</head>


<body>


    <!-- =====================================================
         ENCABEZADO / LOGO
    ====================================================== -->

    <header class="encabezado"></header>


    <!-- =====================================================
         CARTA DIGITAL
    ====================================================== -->

    <main>

        <div id="cargando">
            Cargando carta...
        </div>

        <div id="carta"></div>

    </main>


    <!-- =====================================================
         BARRA FIJA DEL CARRITO
    ====================================================== -->

    <div id="carrito-barra">

        <div>

            <span>🛒</span>

            <span id="cantidad-carrito">
                0 productos
            </span>

        </div>


        <strong id="total-carrito">
            $0
        </strong>


        <button
            type="button"
            onclick="mostrarCarrito()"
        >
            Ver pedido
        </button>

    </div>


    <!-- =====================================================
         MODAL DEL CARRITO
    ====================================================== -->

    <div
        id="modal-carrito"
        class="modal"
    >

        <div class="modal-contenido">


            <button
                type="button"
                class="cerrar"
                onclick="cerrarCarrito()"
                aria-label="Cerrar"
            >
                ✕
            </button>


            <h2>
                Mi pedido
            </h2>


            <div id="lista-carrito"></div>


            <div class="total-final">

                Total:

                <strong id="total-modal">
                    $0
                </strong>

            </div>


            <button
                type="button"
                class="btn-whatsapp"
                onclick="enviarWhatsApp()"
            >

                🟢 Enviar pedido por WhatsApp

            </button>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /*
         * Cargamos app.js DESPUÉS de generar
         * la versión de cache.
         */

        const script = document.createElement("script");

        script.src =
            "app.js?v=" +
            VERSION_CACHE;

        script.defer = true;

        document.body.appendChild(script);

    </script>


</body>

</html>
