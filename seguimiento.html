<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seguimiento de pedido - Don Elio
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f5f5;

            color:
                #222;

        }


        .contenedor {

            max-width: 600px;

            margin:
                0 auto;

        }


        .tarjeta {

            background:
                white;

            border-radius:
                16px;

            padding:
                25px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.10);

        }


        .logo {

            display:
                block;

            width:
                120px;

            height:
                120px;

            object-fit:
                contain;

            margin:
                0 auto 15px;

        }


        h1 {

            text-align:
                center;

            margin:
                0 0 10px;

        }


        .numero {

            text-align:
                center;

            font-size:
                20px;

            font-weight:
                bold;

            margin-bottom:
                25px;

        }


        .estado {

            text-align:
                center;

            font-size:
                24px;

            font-weight:
                bold;

            margin:
                20px 0 10px;

        }


        .mensaje {

            text-align:
                center;

            color:
                #666;

            margin-bottom:
                30px;

            line-height:
                1.5;

        }


        .seguimiento {

            margin-top:
                20px;

        }


        .linea {

            display:
                flex;

            align-items:
                center;

            margin:
                18px 0;

        }


        .circulo {

            width:
                24px;

            height:
                24px;

            border-radius:
                50%;

            background:
                #d9d9d9;

            flex-shrink:
                0;

            border:
                3px solid #d9d9d9;

        }


        .circulo.activo {

            background:
                #20a464;

            border-color:
                #20a464;

        }


        .circulo.actual {

            background:
                #ff9800;

            border-color:
                #ff9800;

        }


        .texto-estado {

            margin-left:
                14px;

            font-size:
                17px;

            color:
                #888;

        }


        .texto-estado.activo {

            color:
                #222;

            font-weight:
                bold;

        }


        .texto-estado.actual {

            color:
                #e65100;

            font-weight:
                bold;

        }


        /* ====================================================
           PENDIENTE DE APROBACIÓN (nuevo — no existía antes)
        ==================================================== */

        .pendiente {

            text-align:
                center;

            background:
                #e3f2fd;

            border:
                1px solid #90caf9;

            border-radius:
                12px;

            padding:
                20px;

            margin:
                20px 0;

        }


        .pendiente-icono {

            font-size:
                42px;

            margin-bottom:
                10px;

        }


        .pendiente-titulo {

            color:
                #1565c0;

            font-size:
                23px;

            font-weight:
                bold;

        }


        .pendiente-mensaje {

            color:
                #0d47a1;

            margin-top:
                10px;

        }


        /* ====================================================
           CANCELADO
        ==================================================== */

        .cancelado {

            text-align:
                center;

            background:
                #ffebee;

            border:
                1px solid #ef9a9a;

            border-radius:
                12px;

            padding:
                20px;

            margin:
                20px 0;

        }


        .cancelado-icono {

            font-size:
                42px;

            margin-bottom:
                10px;

        }


        .cancelado-titulo {

            color:
                #c62828;

            font-size:
                23px;

            font-weight:
                bold;

        }


        .cancelado-mensaje {

            color:
                #b71c1c;

            margin-top:
                10px;

        }


        .detalle {

            margin-top:
                30px;

            border-top:
                1px solid #ddd;

            padding-top:
                20px;

        }


        .detalle h3 {

            margin-top:
                0;

        }


        .producto {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                12px 0;

            border-bottom:
                1px solid #eee;

        }


        .producto-nombre {

            flex:
                1;

        }


        .producto-precio {

            white-space:
                nowrap;

            font-weight:
                bold;

        }


        .total {

            display:
                flex;

            justify-content:
                space-between;

            font-size:
                20px;

            font-weight:
                bold;

            margin-top:
                20px;

        }


        .error {

            text-align:
                center;

            padding:
                30px 10px;

            color:
                #c62828;

            font-size:
                18px;

        }


        .cargando {

            text-align:
                center;

            padding:
                40px 10px;

            color:
                #666;

        }


        .actualizando {

            text-align:
                center;

            font-size:
                12px;

            color:
                #999;

            margin-top:
                25px;

        }

    </style>

</head>


<body>


<div class="contenedor">

    <div class="tarjeta">


        <img
            id="logo"
            class="logo"
            alt="Don Elio"
        >


        <h1>
            Seguimiento de pedido
        </h1>


        <div
            id="contenido"
            class="cargando"
        >
            Cargando pedido...
        </div>


    </div>

</div>


<script>

"use strict";


/* ============================================================
   CONFIGURACIÓN
============================================================ */

const API_URL =
    "https://lightpos-api.doneliopizzeria.com.ar";


const URL_GITHUB =
    "https://raw.githubusercontent.com/"
    + "doneliopizza/CartaDigital/main";


const URL_LOGO =
    URL_GITHUB +
    "/fotos/logo.png";


const logo =
    document.getElementById("logo");


if (logo) {

    logo.src =
        URL_LOGO +
        "?v=" +
        Date.now();

}


/* ============================================================
   TOKEN — viene como ?t=XXXX en el link
============================================================ */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const token =
    parametros.get("t");


const contenido =
    document.getElementById(
        "contenido"
    );


/* ============================================================
   PASOS DEL SEGUIMIENTO (estado_cocina_id 1-4; el 0 y el 5
   se muestran aparte, con su propio cartel)
============================================================ */

const estados = [

    { id: 1, nombre: "En preparación" },
    { id: 2, nombre: "Listo" },
    { id: 3, nombre: "Enviar delivery" },
    { id: 4, nombre: "Finalizado" }

];


function obtenerMensaje(estadoId) {

    switch (Number(estadoId)) {

        case 0:
            return "Todavía no confirmamos tu pedido — en breve te avisamos.";

        case 1:
            return "Recibimos tu pedido y ya estamos preparándolo.";

        case 2:
            return "¡Tu pedido está listo!";

        case 3:
            return "Tu pedido está en camino.";

        case 4:
            return "¡Tu pedido fue entregado!";

        case 5:
            return "Este pedido fue cancelado o no pudo confirmarse.";

        default:
            return "Consultando estado del pedido.";
    }
}


/* ============================================================
   CARGAR PEDIDO
============================================================ */

async function cargarPedido() {

    if (!token) {

        contenido.innerHTML = `<div class="error">Enlace de seguimiento inválido.</div>`;

        return;
    }

    try {

        const respuesta = await fetch(
            API_URL + "/carta/seguimiento/" + encodeURIComponent(token) + "?v=" + Date.now()
        );

        let datos;

        try {
            datos = await respuesta.json();
        } catch {
            datos = {};
        }

        if (!respuesta.ok) {
            throw new Error(datos.detail || "No se pudo consultar el pedido.");
        }

        if (!datos.pedido) {
            throw new Error("La API no devolvió el pedido.");
        }

        mostrarPedido(datos.pedido);

    } catch (error) {

        console.error("Error seguimiento:", error);

        contenido.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    }
}


/* ============================================================
   MOSTRAR PEDIDO
============================================================ */

function mostrarPedido(pedido) {

    const estadoId = Number(pedido.estado_cocina_id);
    const estadoNombre = pedido.estado_cocina || "Estado desconocido";

    let estadoHtml = "";


    /* --------------------------------------------------------
       PENDIENTE DE APROBACIÓN (nuevo)
    -------------------------------------------------------- */

    if (estadoId === 0) {

        estadoHtml = `
            <div class="pendiente">
                <div class="pendiente-icono">⏳</div>
                <div class="pendiente-titulo">Esperando confirmación</div>
                <div class="pendiente-mensaje">${escapeHtml(obtenerMensaje(estadoId))}</div>
            </div>
        `;

    /* --------------------------------------------------------
       CANCELADO / RECHAZADO
    -------------------------------------------------------- */

    } else if (estadoId === 5) {

        estadoHtml = `
            <div class="cancelado">
                <div class="cancelado-icono">🔴</div>
                <div class="cancelado-titulo">Pedido cancelado</div>
                <div class="cancelado-mensaje">${escapeHtml(obtenerMensaje(estadoId))}</div>
            </div>
        `;

    } else {

        const posicion = estados.findIndex(estado => estado.id === estadoId);

        let pasos = "";

        estados.forEach((estado, indice) => {

            let claseCirculo = "";
            let claseTexto = "";

            if (posicion >= 0 && indice < posicion) {
                claseCirculo = "activo";
                claseTexto = "activo";
            } else if (indice === posicion) {
                claseCirculo = "actual";
                claseTexto = "actual";
            }

            pasos += `
                <div class="linea">
                    <div class="circulo ${claseCirculo}"></div>
                    <div class="texto-estado ${claseTexto}">${escapeHtml(estado.nombre)}</div>
                </div>
            `;
        });

        estadoHtml = `
            <div class="estado">${escapeHtml(estadoNombre)}</div>
            <div class="mensaje">${escapeHtml(obtenerMensaje(estadoId))}</div>
            <div class="seguimiento">${pasos}</div>
        `;
    }


    let detalleHtml = "";

    if (Array.isArray(pedido.detalle)) {

        pedido.detalle.forEach(item => {

            detalleHtml += `
                <div class="producto">
                    <div class="producto-nombre">
                        ${escapeHtml(item.cantidad)} x ${escapeHtml(item.nombre_producto)}
                    </div>
                    <div class="producto-precio">${formatearPrecio(item.subtotal)}</div>
                </div>
            `;
        });
    }

    contenido.innerHTML = `
        <div class="numero">Pedido #${escapeHtml(pedido.numero_pedido)}</div>

        ${estadoHtml}

        <div class="detalle">
            <h3>Detalle</h3>
            ${detalleHtml}
            <div class="total">
                <span>TOTAL</span>
                <span>${formatearPrecio(pedido.total)}</span>
            </div>
        </div>

        <div class="actualizando">El estado se actualiza automáticamente.</div>
    `;
}


function formatearPrecio(valor) {

    return new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 0
    }).format(Number(valor || 0));
}


function escapeHtml(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


cargarPedido();

setInterval(cargarPedido, 10000);

</script>


</body>

</html>
